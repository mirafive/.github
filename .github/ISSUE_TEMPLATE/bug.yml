name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: The smallest code that shows it. Never paste a secret key.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: SDK, framework, runtime (for example "@mirafive/next 2.0.0, Next.js 16.4, Node 24")
    validations:
      required: true
