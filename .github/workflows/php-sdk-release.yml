# Releases a MIRA FIVE PHP SDK when main's CHANGELOG.md names a version that is not tagged yet:
# add the `## x.y.z — date` section (and bump the version constant, if the package has one),
# merge. Packagist reads the new tag; this adds the GitHub release.
name: php-sdk-release

on:
  workflow_call:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -m1 -oE '^## [0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)? ' CHANGELOG.md | cut -d' ' -f2)
          [ -n "$version" ] || { echo "::error::no version section in CHANGELOG.md"; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then echo "v$version is released already."; exit 0; fi
          if grep -rqE "VERSION = '[^']+'" src; then
            grep -rqE "VERSION = '$version'" src || { echo "::error::the VERSION constant is not $version"; exit 1; }
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$version" -m "v$version" && git push origin "v$version"
          awk -v v="$version" '$0 ~ "^## "v" " {f=1; next} /^## / {if (f) exit} f' CHANGELOG.md > notes.md
          gh release create "v$version" --verify-tag --title "v$version" --notes-file notes.md
